services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-samren}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-samren}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \$\$POSTGRES_USER -d \$\$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  shivra-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.shivra-api
    restart: unless-stopped
    ports:
      - "${SHIVRA_PORT:-8000}:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - SHIVRA_CONCURRENCY=${SHIVRA_CONCURRENCY:-32}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${SHIVRA_WORKERS:-2}", "--limit-concurrency", "${SHIVRA_LIMIT_CONCURRENCY:-100}"]
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-samren}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-samren}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-samren}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-samren}?schema=public
      - REDIS_URL=redis://redis:6379
      - SHIVRA_API_URL=http://shivra-api:8000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in the environment}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - API_PROXY_CONCURRENCY=${API_PROXY_CONCURRENCY:-32}
      - API_STREAM_CONCURRENCY=${API_STREAM_CONCURRENCY:-8}
      - SEED_ADMIN=${SEED_ADMIN:-false}
      - ADMIN_BOOTSTRAP_USERNAME=${ADMIN_BOOTSTRAP_USERNAME:-}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-}
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "4000", "--workers", "${API_WORKERS:-2}", "--limit-concurrency", "${API_LIMIT_CONCURRENCY:-100}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      shivra-api:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - admin
      - api

volumes:
  postgres_data:
  redis_data:
