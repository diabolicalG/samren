services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-samren}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-samren}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$(printenv POSTGRES_USER)\" -d \"$(printenv POSTGRES_DB)\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  shivra-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.shivra-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SHIVRA_PORT:-8000}:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - SHIVRA_CONCURRENCY=${SHIVRA_CONCURRENCY:-32}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${SHIVRA_WORKERS:-2}", "--limit-concurrency", "${SHIVRA_LIMIT_CONCURRENCY:-100}"]
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-samren}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-samren}
      - DIRECT_URL=postgresql+psycopg2://${POSTGRES_USER:-samren}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-samren}
      - REDIS_URL=redis://redis:6379
      - SHIVRA_API_URL=http://shivra-api:8000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in the environment}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - API_PROXY_CONCURRENCY=${API_PROXY_CONCURRENCY:-32}
      - API_STREAM_CONCURRENCY=${API_STREAM_CONCURRENCY:-8}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - SEED_ADMIN=${SEED_ADMIN:-false}
      - ADMIN_BOOTSTRAP_USERNAME=${ADMIN_BOOTSTRAP_USERNAME:-}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-}
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "4000", "--workers", "${API_WORKERS:-2}", "--limit-concurrency", "${API_LIMIT_CONCURRENCY:-100}", "--proxy-headers", "--forwarded-allow-ips", "172.16.0.0/12"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      shivra-api:
        condition: service_started

  download-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.download-worker
    restart: unless-stopped
    environment:
      - APP_ENV=worker
      - DATABASE_URL=postgresql://${POSTGRES_USER:-samren}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-samren}
      - REDIS_URL=redis://redis:6379
      - SHIVRA_API_URL=http://shivra-api:8000
      - DOWNLOAD_DIR=/downloads
      - DOWNLOAD_CONCURRENCY=${DOWNLOAD_CONCURRENCY:-2}
      - DOWNLOAD_POLL_INTERVAL=${DOWNLOAD_POLL_INTERVAL:-2}
      - DOWNLOAD_STALE_AFTER=${DOWNLOAD_STALE_AFTER:-21600}
      - DOWNLOAD_MAX_BYTES=${DOWNLOAD_MAX_BYTES:-5368709120}
      - DB_POOL_SIZE=2
      - DB_MAX_OVERFLOW=2
    volumes:
      - download_data:/downloads
    depends_on:
      api:
        condition: service_healthy
      shivra-api:
        condition: service_started
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  download_data:
