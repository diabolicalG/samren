upstream samren-web {
    server web:3000;
}

upstream samren-admin {
    server admin:3001;
}

upstream samren-api {
    server api:4000;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 500M;

    # Web app
    location / {
        proxy_pass http://samren-web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin app
    location /admin/ {
        proxy_pass http://samren-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API gateway
    location /api/ {
        proxy_pass http://samren-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health/ {
        proxy_pass http://samren-api/health;
    }
}
