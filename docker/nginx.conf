events {}

http {
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    
    upstream samren-web {
        server web:3000;
    }
    
    upstream samren-admin {
        server admin:3001;
    }
    
    upstream samren-api {
        server api:4000;
        keepalive 32;
    }
    
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 2M;
        keepalive_timeout 65;
    
        location / {
            proxy_pass http://samren-web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    
        location /admin/ {
            proxy_pass http://samren-admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    
        location /v1/ {
            limit_req zone=api_per_ip burst=60 nodelay;
            limit_conn conn_per_ip 20;
            proxy_pass http://samren-api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 35s;
        }
    
        location /api/ {
            limit_req zone=api_per_ip burst=60 nodelay;
            limit_conn conn_per_ip 20;
            proxy_pass http://samren-api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 35s;
        }
    
        location /health/ {
            proxy_pass http://samren-api/health;
        }
    }
    
}
