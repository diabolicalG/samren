name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: samren
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: samren
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samren -d samren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://samren:ci-only@localhost:5432/samren
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies and reconcile lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile when it changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: synchronize pnpm lockfile"
            git pull --rebase origin main
            git push
          fi
      - name: Validate Prisma schema
        working-directory: apps/backend
        run: pnpm db:validate
      - name: Generate Prisma client
        working-directory: apps/backend
        run: pnpm db:generate
      - name: Apply catalogue migrations
        working-directory: apps/backend
        run: pnpm db:migrate:deploy
      - name: Seed deterministic catalogue fixtures
        working-directory: apps/backend
        run: pnpm db:seed
      - name: Lint active foundation code
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Backend API tests
        run: pnpm --filter @samren/backend test
      - name: Frontend smoke and accessibility tests
        run: pnpm --filter @samren/frontend test
      - name: Build frontend and backend
        run: pnpm build
