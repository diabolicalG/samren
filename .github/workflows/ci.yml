name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: samren
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: samren
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samren -d samren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://samren:ci-only@localhost:5432/samren
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        working-directory: apps/backend
        run: pnpm db:validate
      - name: Generate Prisma client
        working-directory: apps/backend
        run: pnpm db:generate
      - name: Apply catalogue migrations
        working-directory: apps/backend
        run: pnpm db:migrate:deploy
      - name: Seed deterministic catalogue fixtures
        working-directory: apps/backend
        run: pnpm db:seed
      - name: Verify seed idempotence
        working-directory: apps/backend
        run: pnpm db:seed
      - name: Lint active foundation code
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Backend API tests
        run: pnpm --filter @samren/backend test
      - name: Frontend smoke and accessibility tests
        run: pnpm --filter @samren/frontend test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python API dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Python API tests
        working-directory: apps/api
        run: pytest -q
      - name: Build frontend and backend
        run: pnpm build
