name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies and reconcile lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile when it changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: synchronize pnpm lockfile"
            git push
          fi
      - name: Validate Prisma schema
        working-directory: apps/backend
        env:
          DATABASE_URL: "postgresql://samren:ci-only@localhost:5432/samren"
        run: pnpm db:validate
      - name: Generate Prisma client
        working-directory: apps/backend
        env:
          DATABASE_URL: "postgresql://samren:ci-only@localhost:5432/samren"
        run: pnpm db:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Backend API tests
        run: pnpm --filter @samren/backend test
      - name: Frontend smoke and accessibility tests
        run: pnpm --filter @samren/frontend test
      - name: Build frontend and backend
        run: pnpm build
