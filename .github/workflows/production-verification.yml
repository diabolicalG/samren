name: Production Verification

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  production-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_USER: samren
      POSTGRES_PASSWORD: ci-production-password
      POSTGRES_DB: samren
      JWT_SECRET: ci-production-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      APP_ENV: production
      CORS_ORIGIN: http://localhost,http://localhost:3000,http://localhost:3001
      API_WORKERS: 2
      API_LIMIT_CONCURRENCY: 100
      SHIVRA_WORKERS: 2
      SHIVRA_LIMIT_CONCURRENCY: 100
      RATE_LIMIT_DEFAULT: 1200/minute
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose configuration
        run: docker compose -f docker/docker-compose.yml config

      - name: Build production images
        run: docker compose -f docker/docker-compose.yml build --pull

      - name: Start production stack
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for stack
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1/health/ >/dev/null; then
              break
            fi
            sleep 5
          done
          curl -fsS http://127.0.0.1/health/ >/dev/null

      - name: Production smoke and integration checks
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            local url="$2"
            echo "== $name =="
            curl --fail --silent --show-error --max-time 20 "$url" -o /tmp/response
            test -s /tmp/response
            head -c 500 /tmp/response
            echo
          }

          check "web" "http://127.0.0.1/"
          check "admin" "http://127.0.0.1/admin/"
          check "api health" "http://127.0.0.1/health/"
          check "provider health" "http://127.0.0.1/v1/providers/health"
          check "unified search" "http://127.0.0.1/v1/search?q=one%20piece&limit=5"
          check "legacy anime detail" "http://127.0.0.1/api/anime/21"
          check "legacy episodes" "http://127.0.0.1/api/anime/21/episodes"

          python - <<'PY'
          import json, urllib.request
          checks = [
              ("provider-health", "http://127.0.0.1/v1/providers/health"),
              ("unified-search", "http://127.0.0.1/v1/search?q=one%20piece&limit=5"),
          ]
          for name, url in checks:
              with urllib.request.urlopen(url, timeout=20) as r:
                  data = json.load(r)
                  assert data is not None, name
                  print(name, "status=", r.status)
          PY

      - name: Database and Redis integration checks
        run: |
          docker compose -f docker/docker-compose.yml exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          docker compose -f docker/docker-compose.yml exec -T redis redis-cli ping
          docker compose -f docker/docker-compose.yml ps

      - name: Warm-cache capacity test
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, statistics, time, urllib.parse
          import httpx

          URL = "http://127.0.0.1/v1/search?" + urllib.parse.urlencode({"q": "one piece", "limit": 5})

          async def burst(concurrency):
              limits = httpx.Limits(max_connections=concurrency * 2, max_keepalive_connections=concurrency)
              timeout = httpx.Timeout(10.0)
              async with httpx.AsyncClient(limits=limits, timeout=timeout) as client:
                  barrier = asyncio.Event()
                  async def one():
                      await barrier.wait()
                      started = time.perf_counter()
                      r = await client.get(URL)
                      return r.status_code, (time.perf_counter() - started) * 1000
                  tasks = [asyncio.create_task(one()) for _ in range(concurrency)]
                  barrier.set()
                  results = await asyncio.gather(*tasks)
              lat = sorted(x[1] for x in results)
              statuses = {}
              for s, _ in results:
                  statuses[s] = statuses.get(s, 0) + 1
              p95 = lat[min(len(lat)-1, int(0.95*(len(lat)-1)))]
              print({"mode": "burst", "concurrency": concurrency, "requests": len(results),
                     "statuses": statuses, "p50_ms": round(statistics.median(lat), 1),
                     "p95_ms": round(p95, 1), "max_ms": round(max(lat), 1)})
              assert statuses.get(200, 0) == len(results), statuses
              assert p95 < 2000, p95

          async def sustained(rate, duration=30):
              interval = 1 / rate
              results = []
              deadline = time.monotonic() + duration
              limits = httpx.Limits(max_connections=100, max_keepalive_connections=50)
              timeout = httpx.Timeout(10.0)
              async with httpx.AsyncClient(limits=limits, timeout=timeout) as client:
                  async def one():
                      started = time.perf_counter()
                      try:
                          r = await client.get(URL)
                          return r.status_code, (time.perf_counter() - started) * 1000
                      except Exception:
                          return "error", (time.perf_counter() - started) * 1000
                  while time.monotonic() < deadline:
                      results.append(await one())
                      await asyncio.sleep(max(0, interval - (results[-1][1] / 1000)))
              lat = sorted(x[1] for x in results)
              statuses = {}
              for s, _ in results:
                  statuses[s] = statuses.get(s, 0) + 1
              p95 = lat[min(len(lat)-1, int(0.95*(len(lat)-1)))]
              print({"mode": "sustained", "rate_rps": rate, "requests": len(results),
                     "statuses": statuses, "p50_ms": round(statistics.median(lat), 1),
                     "p95_ms": round(p95, 1), "max_ms": round(max(lat), 1)})
              assert statuses.get(200, 0) == len(results), statuses
              assert p95 < 2000, p95

          async def main():
              for c in (10, 25, 50, 100):
                  await burst(c)
              await sustained(5, 30)

          asyncio.run(main())
          PY

      - name: Browser navigation and screenshot verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/samren-browser /tmp/samren-browser-test
          cd /tmp/samren-browser-test
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            page.setDefaultTimeout(15000);

            const snap = async (name) => {
              await page.screenshot({ path: '/tmp/samren-browser/' + name + '.png', fullPage: true });
              console.log('SCREENSHOT', name, 'url=', page.url(), 'title=', await page.title());
            };

            await page.goto('http://127.0.0.1/', { waitUntil: 'networkidle' });
            await snap('01-home');
            if ((await page.locator('text=Samren').count()) === 0) throw new Error('Homepage did not render Samren navigation');

            await page.getByRole('link', { name: 'Search' }).click();
            await page.waitForURL('**/search');
            await snap('02-search-empty');

            const input = page.getByPlaceholder('Search anime...');
            await input.fill('one piece');
            await input.press('Enter');
            await page.waitForTimeout(5000);
            await snap('03-search-results');

            const resultLinks = page.locator('a[href^="/anime/"]');
            const resultCount = await resultLinks.count();
            console.log('SEARCH_RESULT_LINKS', resultCount);
            if (resultCount === 0) throw new Error('Unified search produced no navigable anime result');

            await resultLinks.first().click();
            await page.waitForURL('**/anime/**');
            await page.waitForTimeout(3000);
            await snap('04-anime-detail-watch');

            const episodeButtons = page.locator('button[aria-current="true"]');
            console.log('ACTIVE_EPISODE_BUTTONS', await episodeButtons.count());
            if ((await page.locator('text=Watch experience').count()) === 0) throw new Error('Anime watch experience did not render');

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto('http://127.0.0.1/', { waitUntil: 'networkidle' });
            await mobile.screenshot({ path: '/tmp/samren-browser/05-home-mobile.png', fullPage: true });
            console.log('SCREENSHOT', '05-home-mobile', 'url=', mobile.url());

            await browser.close();
          })().catch(async (err) => {
            console.error(err.stack || err);
            process.exit(1);
          });
          NODE

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samren-browser-screenshots
          path: /tmp/samren-browser/
          if-no-files-found: error

      - name: Capture resource snapshot
        if: always()
        run: |
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}'
          docker compose -f docker/docker-compose.yml logs --tail=200 api shivra-api nginx web admin download-worker

      - name: Shutdown
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
